<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="meta.title">页面标题</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/article.css">
  <link rel="stylesheet" href="../css/aside.css">
  <link rel="stylesheet" href="../css/recommend.css">
  <link rel="stylesheet" href="../css/footer.css">
  
</head>
<body data-page="test">

    <!-- 组件占位符，layout.js 会替换这些元素 -->
    <div id="layout-header"></div>

    <main>
        <!-- ✏️ 只需修改这里的文章内容 -->
        <article id="chap1">

            <h2 align="center" data-i18n="a1.title"></h2>

            <!-- 语音播放条 -->
            <audio class="article-audio" controls preload="metadata">
            <source src="../assets/audio/yangxianyi.mp3" type="audio/mpeg">
            </audio>

            <!-- 文中图片 + 图注 -->
            <figure class="article-figure">
                <img class="portrait" src="../assets/images/杨仙逸.webp" alt="语义化标签结构示意图" loading="lazy">
                <figcaption data-i18n="a1.s1.fig1">图1：图1</figcaption>
            </figure>
            <p class="meta" data-i18n="a1.meta"></p>
            <p data-i18n="a1.intro"></p>
            <!-- 文中图片 + 图注 -->
            <figure class="article-figure">
                <img src="../assets/images/孙中山和宋庆龄在乐士文1号前合影.webp" alt="语义化标签结构示意图" loading="lazy">
                <figcaption data-i18n="a1.s1.fig1">图2：图2</figcaption>
            </figure>
            <section id="chap1-1">
            <h3 data-i18n="a1.s1.title"></h3>
            <ul>
            <li data-i18n-html="a1.s1.li1"></li>
            <li data-i18n-html="a1.s1.li2"></li>
            </ul>
            </section>
        </article>
        
    </main>

    <div id="layout-recommend"></div>
    <div id="layout-toc"></div>
    <div id="layout-footer"></div>

    <script type="module">
        import { initLayout } from '../js/layout.js';
        import { initI18n }   from '../js/i18n.js';
        import { initToc }    from '../js/toc.js';

        // 顺序：先注入组件 → 再初始化语言 → 再生成目录
        await initLayout();
        await initI18n();
        initToc();
    </script>
</body>
</html>
